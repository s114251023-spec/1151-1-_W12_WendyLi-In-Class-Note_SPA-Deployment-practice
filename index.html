<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>BNA–EMI Learning Studio</title>

<style>
  :root {
    --bg: #f4f6fa;
    --surface: #ffffff;
    --text: #172338;
    --muted: #526078;
    --line: #d8dfeb;
    --accent: #245ac3;
    --soft: #eaf0ff;
    --shadow: 0 12px 36px rgba(20, 40, 75, .08);
  }

  [data-theme="dark"] {
    --bg: #101722;
    --surface: #192333;
    --text: #eef3fc;
    --muted: #b4c0d4;
    --line: #35445b;
    --accent: #a3c0ff;
    --soft: #243653;
    --shadow: 0 12px 36px rgba(0, 0, 0, .2);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 100px; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI",
      "Noto Sans TC", sans-serif;
    line-height: 1.75;
  }

  button, a { -webkit-tap-highlight-color: transparent; }
  button { font: inherit; }
  button, .skip-link { cursor: pointer; }
  button:focus-visible, a:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 4px;
  }

  .skip-link {
    position: fixed;
    top: -100px;
    left: 12px;
    z-index: 100;
    padding: 10px 16px;
    background: var(--surface);
    color: var(--text);
  }
  .skip-link:focus { top: 10px; }

  header {
    position: sticky;
    top: 0;
    z-index: 30;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }

  .header-inner {
    max-width: 1200px;
    margin: auto;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand { flex: 1; min-width: 0; }
  .brand strong { display: block; line-height: 1.3; }
  .brand small { color: var(--muted); font-size: .8rem; }
  .controls { display: flex; gap: 8px; }

  .control, .page-button {
    min-height: 44px;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 14px;
    background: var(--surface);
    color: var(--text);
  }

  .control:hover, .page-button:hover:not(:disabled) {
    background: var(--soft);
  }
  .menu-toggle { font-size: 1.3rem; }
  .page-button:disabled { opacity: .45; cursor: not-allowed; }

  .backdrop {
    position: fixed;
    inset: 0;
    z-index: 40;
    background: rgba(0, 0, 0, .45);
  }

  .drawer {
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    width: min(350px, 88vw);
    z-index: 50;
    overflow-y: auto;
    padding: 20px;
    background: var(--surface);
    box-shadow: var(--shadow);
  }

  [hidden] { display: none !important; }
  .drawer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
  }
  .drawer-header h2 { margin: 0; font-size: 1.2rem; }
  .nav-group { margin: 20px 0; }
  .nav-group h3 {
    margin: 0 0 8px;
    color: var(--muted);
    font-size: .9rem;
  }
  .topic-link {
    display: block;
    width: 100%;
    margin: 5px 0;
    padding: 10px 12px;
    text-align: left;
    border: 1px solid transparent;
    border-radius: 8px;
    color: var(--text);
    background: transparent;
  }
  .topic-link:hover { background: var(--soft); }
  .topic-link[aria-current="page"] {
    background: var(--soft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 700;
  }

  main {
    max-width: 1000px;
    min-height: 65vh;
    margin: auto;
    padding: 36px 20px;
  }

  .eyebrow {
    margin: 0;
    color: var(--accent);
    font-size: .85rem;
    font-weight: 700;
  }

  h1 {
    margin: 10px 0 16px;
    font-size: clamp(1.8rem, 4vw, 2.8rem);
    line-height: 1.25;
  }
  .lead { font-size: 1.1rem; color: var(--muted); }

  .progress {
    height: 6px;
    overflow: hidden;
    background: var(--line);
    border-radius: 10px;
    margin: 22px 0;
  }
  .progress span {
    display: block;
    height: 100%;
    background: var(--accent);
  }

  .content-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
    gap: 20px;
    margin-top: 24px;
  }

  .card {
    padding: 24px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow);
  }
  .card h2 { margin: 0 0 12px; font-size: 1.2rem; }
  .card p { margin: 0; }
  .card ul { padding-left: 22px; margin-bottom: 0; }
  .card li + li { margin-top: 10px; }
  .reflection { background: var(--soft); }

  .draft-note {
    margin-top: 24px;
    color: var(--muted);
    font-size: .85rem;
  }

  .page-navigation {
    margin-top: 32px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }

  footer {
    padding: 24px 20px;
    text-align: center;
    border-top: 1px solid var(--line);
    background: var(--surface);
    color: var(--muted);
    font-size: .85rem;
  }
  footer p { margin: 4px 0; }

  @media (max-width: 640px) {
    .header-inner { padding: 10px 12px; gap: 8px; }
    .brand small { display: none; }
    .brand strong { font-size: .9rem; }
    .control { padding: 8px 10px; }
    main { padding: 24px 16px; }
    .content-grid { grid-template-columns: 1fr; }
    .card { padding: 20px; }
    .page-navigation { flex-wrap: wrap; }
    .page-button { flex: 1; font-size: .9rem; }
    #topButton { order: 3; flex-basis: 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
  }
</style>
</head>

<body>
<a class="skip-link" href="#main" id="skipLink">Skip to content</a>

<header>
  <div class="header-inner">
    <button class="control menu-toggle" id="menuButton"
      aria-label="Open topic menu" aria-expanded="false"
      aria-controls="topicDrawer">☰</button>

    <div class="brand">
      <strong id="brandTitle">BNA–EMI Learning Studio</strong>
      <small id="brandSubtitle">Thinking → Mapping → Creating</small>
    </div>

    <div class="controls">
      <button class="control" id="languageButton"
        aria-label="Switch to Traditional Chinese">中文</button>
      <button class="control" id="themeButton"
        aria-label="Switch color theme">☾</button>
    </div>
  </div>
</header>

<div class="backdrop" id="backdrop" hidden></div>

<aside class="drawer" id="topicDrawer" role="dialog"
  aria-modal="true" aria-labelledby="menuTitle" hidden>
  <div class="drawer-header">
    <h2 id="menuTitle">Modules & topics</h2>
    <button class="control" id="closeMenu"
      aria-label="Close menu">✕</button>
  </div>
  <nav id="topicNavigation" aria-label="Learning topics"></nav>
</aside>

<main id="main" tabindex="-1">
  <p class="eyebrow" id="moduleLabel"></p>
  <h1 id="pageTitle" tabindex="-1"></h1>
  <p class="lead" id="pageIntroduction"></p>

  <div class="progress" role="progressbar" id="progress"
    aria-label="Reading progress" aria-valuemin="0"
    aria-valuemax="100">
    <span id="progressFill"></span>
  </div>

  <div class="content-grid">
    <section class="card">
      <h2 id="conceptHeading">Key concepts</h2>
      <ul id="conceptList"></ul>
    </section>

    <section class="card reflection">
      <h2 id="reflectionHeading">Try it yourself</h2>
      <p id="reflectionText"></p>
    </section>
  </div>

  <p class="draft-note" id="draftNote"></p>

  <nav class="page-navigation" id="pageNavigation"
    aria-label="Page navigation">
    <button class="page-button" id="previousButton">← Previous</button>
    <button class="page-button" id="topButton">↑ Return to top</button>
    <button class="page-button" id="nextButton">Next →</button>
  </nav>
</main>

<footer>
  <p>Architect: Prof. Shihmin Lo · <span id="versionLabel"></span></p>
  <p id="copyrightLine"></p>
</footer>

<script>
  /*
   * EDIT THESE SETTINGS BEFORE PUBLICATION.
   * Replace the copyright placeholder with the confirmed rights holder.
   */
  const VERSION = "1.0.0";
  const COPYRIGHT_OWNER = "[Copyright owner]";
  const COPYRIGHT_YEAR = 2026;

  // Each bilingual value is [English, Traditional Chinese].
  const ui = {
    title: ["BNA–EMI Learning Studio", "BNA–EMI 學習工作室"],
    subtitle: ["Thinking → Mapping → Creating", "思考 → 心智圖 → 創作"],
    menu: ["Modules & topics", "模組與子主題"],
    openMenu: ["Open topic menu", "開啟主題選單"],
    closeMenu: ["Close menu", "關閉選單"],
    topics: ["Learning topics", "學習主題"],
    concepts: ["Key concepts", "核心概念"],
    reflection: ["Try it yourself", "動手練習"],
    previous: ["← Previous page", "← 上一頁"],
    next: ["Next page →", "下一頁 →"],
    top: ["↑ Return to top", "↑ 回到頂端"],
    navigation: ["Page navigation", "頁面導覽"],
    skip: ["Skip to content", "跳至主要內容"],
    progress: ["Reading progress", "閱讀進度"],
    light: ["Switch to light mode", "切換為淺色模式"],
    dark: ["Switch to dark mode", "切換為深色模式"],
    version: ["Version", "版本"],
    rights: ["All rights reserved.", "保留所有權利。"],
    draft: [
      "Draft learning content developed from the supplied notes. BNA remains undefined pending confirmation.",
      "本學習內容為依提供筆記整理的草稿；BNA 的完整名稱仍待確認。"
    ]
  };

  const modules = [
    ["Overview", "課程概覽"],
    ["Analytical Thinking", "分析思考"],
    ["Mind Mapping", "心智圖"],
    ["Product & Market", "產品與市場"],
    ["Effectiveness & Efficiency", "效果與效率"],
    ["AI-Assisted Workflow", "AI 輔助工作流程"]
  ];

  const pages = [
    {
      id: "overview", module: 0,
      title: ["From ideas to useful products", "從想法到有用的產品"],
      intro: [
        "Connect clear thinking, structured knowledge, and practical creation.",
        "串聯清晰思考、結構化知識與實際創作。"
      ],
      points: [
        ["Understand the problem before choosing a solution.",
         "在選擇解決方案之前，先理解問題。"],
        ["Organize ideas and relationships with a mind map.",
         "利用心智圖整理想法及其關係。"],
        ["Create a small solution, test it, and improve it.",
         "建立小型解決方案，測試後持續改進。"]
      ],
      task: [
        "Choose one everyday problem. Who experiences it, and what would a better outcome look like?",
        "選擇一個日常問題。誰會遇到它？更好的結果會是什麼？"
      ]
    },
    {
      id: "break-down", module: 1,
      title: ["Break down the problem", "拆解問題"],
      intro: [
        "Analytical thinking makes a complex question easier to examine.",
        "分析思考讓複雜的問題更容易被檢視。"
      ],
      points: [
        ["Separate the problem into smaller parts.",
         "將問題拆解為較小的部分。"],
        ["Identify user needs, constraints, and unanswered questions.",
         "辨識使用者需求、限制與尚未回答的問題。"],
        ["Distinguish evidence from assumptions.",
         "區分證據與假設。"]
      ],
      task: [
        "List three parts of your chosen problem and one question you need to investigate for each.",
        "列出所選問題的三個部分，並為每個部分提出一個待查證的問題。"
      ]
    },
    {
      id: "relationships", module: 1,
      title: ["Investigate and reconnect", "探究與重新連結"],
      intro: [
        "After separating the parts, examine how they influence one another.",
        "拆解各部分後，再檢視它們如何相互影響。"
      ],
      points: [
        ["Look for dependencies and possible causes.",
         "尋找相依關係與可能原因。"],
        ["Check proposed relationships against evidence.",
         "以證據檢驗所提出的關係。"],
        ["Recombine findings into a clearer explanation.",
         "重新整合發現，形成更清晰的解釋。"]
      ],
      task: [
        "Connect two parts of your problem. What evidence would support that connection?",
        "連結問題中的兩個部分。什麼證據能支持這個連結？"
      ]
    },
    {
      id: "mind-map", module: 2,
      title: ["Build a structured mind map", "建立結構化心智圖"],
      intro: [
        "A mind map makes topics and relationships easier to see.",
        "心智圖讓主題及其關係更容易被看見。"
      ],
      points: [
        ["Start with one central question or topic.",
         "從一個核心問題或主題開始。"],
        ["Add branches for needs, evidence, ideas, and actions.",
         "新增需求、證據、想法與行動等分支。"],
        ["Use a tool such as Coggle, or begin with paper.",
         "可使用 Coggle 等工具，也可以先用紙筆。"]
      ],
      task: [
        "Create a map with four main branches. Label any uncertain connections.",
        "建立包含四個主要分支的心智圖，並標示尚不確定的連結。"
      ]
    },
    {
      id: "insights", module: 2,
      title: ["Turn representations into insights", "從表徵產生洞見"],
      intro: [
        "Reorganizing information can reveal gaps and new possibilities.",
        "重新組織資訊，有助於發現缺口與新的可能性。"
      ],
      points: [
        ["Group related ideas systematically.",
         "以系統化方式將相關想法分組。"],
        ["Show a process when the order of steps matters.",
         "當步驟順序重要時，呈現流程。"],
        ["Revise the map as new evidence becomes available.",
         "取得新證據時，修訂心智圖。"]
      ],
      task: [
        "Find one missing branch and one new insight in your map.",
        "在心智圖中找出一個缺少的分支，以及一項新洞見。"
      ]
    },
    {
      id: "mvp", module: 3,
      title: ["Define a minimum viable product", "定義最小可行產品"],
      intro: [
        "An MVP is a small, usable version that helps test an important assumption.",
        "MVP 是可使用的小型版本，用來測試重要假設。"
      ],
      points: [
        ["Choose one target user group and one core need.",
         "選定一個目標使用者族群與一項核心需求。"],
        ["Include only the features needed for the initial test.",
         "僅納入初步測試所需的功能。"],
        ["Gather feedback before expanding the product.",
         "先蒐集回饋，再擴充產品。"]
      ],
      task: [
        "Describe your MVP in one sentence and list three essential features.",
        "用一句話描述你的 MVP，並列出三項必要功能。"
      ]
    },
    {
      id: "market", module: 3,
      title: ["Understand users, markets, and value", "理解使用者、市場與價值"],
      intro: [
        "A working product still needs a clear reason for people to use it.",
        "即使產品能正常運作，也需要明確的使用理由。"
      ],
      points: [
        ["Identify who uses the product and who pays for it.",
         "辨識誰使用產品，以及誰支付費用。"],
        ["Explain the benefit compared with existing alternatives.",
         "說明相較於現有替代方案的效益。"],
        ["Consider delivery, maintenance, costs, and pricing.",
         "考量交付、維護、成本與定價。"]
      ],
      task: [
        "Write: This product helps [users] achieve [benefit] by [approach].",
        "完成句子：本產品透過［方法］，協助［使用者］達成［效益］。"
      ]
    },
    {
      id: "evaluation", module: 4,
      title: ["Measure effectiveness and efficiency", "衡量效果與效率"],
      intro: [
        "Reaching the right goal and using resources well are related but different.",
        "達成正確目標與善用資源彼此相關，但並不相同。"
      ],
      points: [
        ["Effectiveness asks whether the intended goal was achieved.",
         "效果關注是否達成預期目標。"],
        ["Efficiency asks how much time, cost, or effort was required.",
         "效率關注所需時間、成本或投入程度。"],
        ["Use evidence and a baseline to compare results.",
         "使用證據與基準來比較結果。"]
      ],
      task: [
        "Choose one goal measure and one resource measure for your MVP.",
        "為你的 MVP 選擇一項目標指標與一項資源指標。"
      ]
    },
    {
      id: "ai-workflow", module: 5,
      title: ["Use AI to support your workflow", "運用 AI 支援工作流程"],
      intro: [
        "AI can assist with organizing material, but its output needs human review.",
        "AI 可協助整理資料，但其輸出仍需人工檢核。"
      ],
      points: [
        ["Prepare notes, permitted recordings, or other source material.",
         "準備筆記、經允許使用的錄音或其他原始資料。"],
        ["Ask AI to organize, summarize, or suggest a structure.",
         "請 AI 整理、摘要或建議內容架構。"],
        ["Verify facts and protect personal or confidential information.",
         "查核事實，並保護個人及機密資訊。"]
      ],
      task: [
        "Draft a prompt asking AI to organize notes, flag uncertainties, and avoid inventing facts.",
        "撰寫提示詞，要求 AI 整理筆記、標示不確定之處，且不得編造事實。"
      ]
    },
    {
      id: "publish", module: 5,
      title: ["Prepare and publish the SPA", "準備與發布 SPA"],
      intro: [
        "Turn reviewed learning content into a simple, accessible website.",
        "將檢核後的學習內容轉為簡單、易用的網站。"
      ],
      points: [
        ["Markdown can be a convenient format for drafting content.",
         "Markdown 可作為方便的內容草稿格式。"],
        ["Use PNG/JPEG for raster images and SVG for scalable diagrams.",
         "點陣圖片可使用 PNG／JPEG；可縮放圖表可使用 SVG。"],
        ["Test mobile layout, both languages, themes, and navigation before publishing.",
         "發布前測試手機版面、兩種語言、色彩模式與導覽。"]
      ],
      task: [
        "Ask a reader to find a topic, change language, and move to the next page. Note any difficulties.",
        "請一位讀者尋找主題、切換語言並前往下一頁，記錄遇到的困難。"
      ]
    }
  ];

  const $ = id => document.getElementById(id);
  const storage = {
    get(key) {
      try { return localStorage.getItem(key); }
      catch { return null; }
    },
    set(key, value) {
      try { localStorage.setItem(key, value); }
      catch { /* The website still works without saved preferences. */ }
    }
  };

  let language = storage.get("bna-language") === "zh" ? "zh" : "en";
  const systemTheme = window.matchMedia("(prefers-color-scheme: dark)");
  const savedTheme = storage.get("bna-theme");
  let theme = ["light", "dark"].includes(savedTheme)
    ? savedTheme : (systemTheme.matches ? "dark" : "light");
  let index = 0;

  function text(pair) { return pair[language === "en" ? 0 : 1]; }

  function applyTheme() {
    document.documentElement.dataset.theme = theme;
    $("themeButton").textContent = theme === "dark" ? "☀" : "☾";
    $("themeButton").setAttribute("aria-label",
      text(theme === "dark" ? ui.light : ui.dark));
  }

  function renderMenu() {
    $("topicNavigation").replaceChildren();

    modules.forEach((module, moduleIndex) => {
      const group = document.createElement("section");
      group.className = "nav-group";
      const heading = document.createElement("h3");
      heading.textContent = text(module);
      group.append(heading);

      pages.forEach((page, pageIndex) => {
        if (page.module !== moduleIndex) return;
        const button = document.createElement("button");
        button.className = "topic-link";
        button.textContent = text(page.title);
        if (pageIndex === index)
          button.setAttribute("aria-current", "page");
        button.addEventListener("click", () => {
          closeMenu();
          goTo(pageIndex);
        });
        group.append(button);
      });

      $("topicNavigation").append(group);
    });
  }

  function render() {
    const page = pages[index];
    document.documentElement.lang = language === "en" ? "en" : "zh-Hant";
    document.title = `${text(page.title)} | ${text(ui.title)}`;

    $("brandTitle").textContent = text(ui.title);
    $("brandSubtitle").textContent = text(ui.subtitle);
    $("menuTitle").textContent = text(ui.menu);
    $("menuButton").setAttribute("aria-label", text(ui.openMenu));
    $("closeMenu").setAttribute("aria-label", text(ui.closeMenu));
    $("topicNavigation").setAttribute("aria-label", text(ui.topics));
    $("skipLink").textContent = text(ui.skip);

    $("languageButton").textContent = language === "en" ? "中文" : "EN";
    $("languageButton").setAttribute("aria-label",
      language === "en" ? "Switch to Traditional Chinese" : "切換為英文");

    $("moduleLabel").textContent =
      `${text(modules[page.module])} · ${index + 1} / ${pages.length}`;
    $("pageTitle").textContent = text(page.title);
    $("pageIntroduction").textContent = text(page.intro);
    $("conceptHeading").textContent = text(ui.concepts);
    $("reflectionHeading").textContent = text(ui.reflection);
    $("reflectionText").textContent = text(page.task);
    $("draftNote").textContent = text(ui.draft);

    $("conceptList").replaceChildren();
    page.points.forEach(point => {
      const li = document.createElement("li");
      li.textContent = text(point);
      $("conceptList").append(li);
    });

    const percent = Math.round((index + 1) / pages.length * 100);
    $("progressFill").style.width = `${percent}%`;
    $("progress").setAttribute("aria-valuenow", percent);
    $("progress").setAttribute("aria-label", text(ui.progress));

    $("previousButton").textContent = text(ui.previous);
    $("nextButton").textContent = text(ui.next);
    $("topButton").textContent = text(ui.top);
    $("previousButton").disabled = index === 0;
    $("nextButton").disabled = index === pages.length - 1;
    $("pageNavigation").setAttribute("aria-label", text(ui.navigation));

    $("versionLabel").textContent = `${text(ui.version)} ${VERSION}`;
    $("copyrightLine").textContent =
      `© ${COPYRIGHT_YEAR} ${COPYRIGHT_OWNER}. ${text(ui.rights)}`;

    applyTheme();
    renderMenu();
  }

  function readRoute(focusHeading = false) {
    const id = location.hash.replace(/^#\/?/, "");
    const found = pages.findIndex(page => page.id === id);

    // Preserve the accessibility skip link rather than treating it as a page.
    if (id === "main") return;

    index = found >= 0 ? found : 0;
    render();
    if (focusHeading) {
      window.scrollTo({ top: 0, behavior: "instant" });
      $("pageTitle").focus({ preventScroll: true });
    }
  }

  function goTo(newIndex) {
    if (newIndex < 0 || newIndex >= pages.length) return;
    const hash = `#/${pages[newIndex].id}`;
    if (location.hash === hash) {
      readRoute(true);
    } else {
      location.hash = hash;
    }
  }

  function openMenu() {
    $("topicDrawer").hidden = false;
    $("backdrop").hidden = false;
    $("menuButton").setAttribute("aria-expanded", "true");
    document.body.style.overflow = "hidden";

    // Keep background content out of keyboard navigation while open.
    document.querySelector("header").inert = true;
    $("main").inert = true;
    document.querySelector("footer").inert = true;
    $("skipLink").inert = true;
    $("closeMenu").focus();
  }

  function closeMenu() {
    $("topicDrawer").hidden = true;
    $("backdrop").hidden = true;
    $("menuButton").setAttribute("aria-expanded", "false");
    document.body.style.overflow = "";
    document.querySelector("header").inert = false;
    $("main").inert = false;
    document.querySelector("footer").inert = false;
    $("skipLink").inert = false;
    $("menuButton").focus();
  }

  $("menuButton").addEventListener("click", openMenu);
  $("closeMenu").addEventListener("click", closeMenu);
  $("backdrop").addEventListener("click", closeMenu);

  document.addEventListener("keydown", event => {
    if ($("topicDrawer").hidden) return;

    if (event.key === "Escape") {
      event.preventDefault();
      closeMenu();
    }

    if (event.key === "Tab") {
      const buttons = [...$("topicDrawer").querySelectorAll("button")];
      const first = buttons[0];
      const last = buttons[buttons.length - 1];

      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    }
  });

  $("languageButton").addEventListener("click", () => {
    language = language === "en" ? "zh" : "en";
    storage.set("bna-language", language);
    render();
  });

  $("themeButton").addEventListener("click", () => {
    theme = theme === "dark" ? "light" : "dark";
    storage.set("bna-theme", theme);
    applyTheme();
  });

  systemTheme.addEventListener("change", event => {
    if (!storage.get("bna-theme")) {
      theme = event.matches ? "dark" : "light";
      applyTheme();
    }
  });

  $("previousButton").addEventListener("click", () => goTo(index - 1));
  $("nextButton").addEventListener("click", () => goTo(index + 1));
  $("topButton").addEventListener("click", () => {
    const reducedMotion =
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    window.scrollTo({
      top: 0,
      behavior: reducedMotion ? "instant" : "smooth"
    });
    $("pageTitle").focus({ preventScroll: true });
  });

  window.addEventListener("hashchange", () => readRoute(true));
  readRoute();
</script>
</body>
</html>
